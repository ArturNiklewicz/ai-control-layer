[project]
name = "ai-control-layer"
version = "0.1.0"
description = "Hybrid guardrails for agentic AI: PII, consent, agent sandbox, injection, audit"
requires-python = ">=3.12"
dependencies = ["openai>=1.60", "numpy>=2"]

[dependency-groups]
dev = ["pytest>=8"]
harness = ["claude-agent-sdk>=0.2", "openai-agents>=0.23", "langchain>=1.4"]  # adapter contract tests only

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["attic", ".venv", "tests/integration/corpus"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = ["tests/integration/corpus", ".venv", "attic"]
