# AI Control Layer — central policy. Read on every hook call / CLI run: edits apply instantly.
# Invalid file => every agent action is denied (fail closed).

version = 1
# enforce: deny/ask as below.  monitor: never block, only log "would_deny" (rollout / tuning).
mode = "enforce"

# ---------------------------------------------------------------- PII & secrets
[pii]
# per-detection action: off | anonymize ([OSOBA]) | pseudonymize ([OSOBA_1], reversible
# via the host-only vault, restored in replies) | block (request / tool call rejected)
default = "pseudonymize"
semantic = true                 # names + addresses via the local LLM in [llm]
semantic_on_error = "fail_closed"   # fail_closed: no output if the LLM is down | regex_only
scan_reads = true               # hook: files the agent reads are scanned; `block` kinds deny, the rest is audited
allow = ["Claude", "Claude Code", "Anthropic", "Opus", "Sonnet", "Haiku", "Qwen", "OpenAI", "GitHub"]  # never PII

[pii.kinds]                     # stricter / looser per category
SECRET = "block"                # keys, tokens, passwords: never leave, never written by agent
CARD = "block"
EMAIL = "anonymize"
PHONE = "anonymize"
# PESEL, NIP, REGON, IBAN, ID_CARD, PERSON, ADDRESS -> default (pseudonymize)

[injection]                     # signature feed (replaceable by an external feed, same schema)
feed = "src/guard/signatures.json"
user_prompt = "warn"            # off | warn (audit only) | block — the human is the principal
reads = "block"                 # files the agent reads: indirect injection vector
tool_output = "block"           # MCP results: high-severity hit => content withheld

[llm]                           # semantic NER on every outgoing text. MUST be private: public hosts are refused
base_url = "http://100.117.237.101:8006/v1"   # vLLM on DGX-A over tailscale (private)
model = "qwen3-35b"

[judge]                         # semantic injection judge on the [llm] model; runs only when signatures found nothing high
enabled = true
threshold = 0.7                 # score >= threshold = attack (then gateway.injection decides block/warn)
on_error = "fail_closed"        # fail_closed: refuse if the judge is down | allow

[gateway]                       # OpenAI-compatible LLM gateway (python -m src.guard.gateway)
injection = "block"             # off | warn | block: signatures on user/tool messages
pii_public = "pseudonymize"     # PII bound for a public model: block | pseudonymize (restored in reply)

[gateway.anthropic]             # Messages API proxy: ANTHROPIC_BASE_URL=http://127.0.0.1:8787
upstream = "https://api.anthropic.com"
models = ["claude-*"]           # fnmatch; anything else is refused

[gateway.models]                # allowed models; anything else is refused. USD per 1M tokens
"qwen3-35b" = { upstream = "http://100.117.237.101:8006/v1", input_usd_mtok = 0.0, output_usd_mtok = 0.0 }
"gpt-4o-mini" = { upstream = "https://api.openai.com/v1", key_env = "OPENAI_API_KEY", input_usd_mtok = 0.15, output_usd_mtok = 0.60 }

# API key -> principal, sha256 only. New key: python -c "import secrets,hashlib;k=secrets.token_urlsafe(32);print(k,hashlib.sha256(k.encode()).hexdigest())"
[gateway.principals.demo]       # demo key "demo-key-change-me": the gateway refuses it off loopback
key_sha256 = "090d1548c9d65f413a1a2c828a0bee3a7ae02d2137caf51e6029e6c3cb1f1fa4"
models = ["qwen3-35b", "gpt-4o-mini"]
daily_tokens = 200000
daily_usd = 1.00

# ---------------------------------------------------------------- agent sandbox
[paths]                         # repo-relative globs the agent may not touch (read or write)
deny = [
  ".env", ".env.*", "secrets.env", "*.pem", "*.key",
  ".git/**",                    # hooks/config = code execution and remote rewrites
  ".guard/**",                  # vault, audit log
  ".claude/**",                 # agent may not rewrite its own hooks/permissions
  "src/guard/**",               # nor this policy or the guard itself
  "data/raw/**",                # raw documents: only the anonymized copies are readable
]

[commands]                      # whitelist of command prefixes; everything else is denied
allow = [
  "ls", "pwd", "cat", "head", "tail", "wc", "grep", "rg", "find", "diff", "uniq",
  "echo", "mkdir", "touch", "cd",
  "git status", "git diff", "git log", "git show", "git add",
  "git branch",                 # listing only: commands.py rejects create/delete/edit forms
  "git ls-files", "git blame", "git stash list",
  "uv run pytest", "uv run --frozen pytest", "pytest",
  "uv run python -m src.guard.cli scan",   # counts only; restore/pseudonymize stay human-only
]
ask = [                         # irreversible -> human confirms in the Claude Code prompt
  "rm", "mv", "git commit", "git reset", "git checkout", "git stash drop", "git clean",
  "git switch", "git restore",  # can roll src/guard back (policy downgrade)
]
# forbidden anywhere in an allowed command. (`git -c x status` already fails the prefix match:
# options before the subcommand never match "git status".)
deny_tokens = [
  "-C", "--git-dir", "--work-tree", "--exec-path",
  "-exec", "-execdir", "-delete", "-ok", "-okdir", "--force", "-f", "-rf", "-fr",
  "-O",                                                  # glued path value: git diff -O/etc/x
  "-fprint", "-fprint0", "-fprintf", "-fls",             # find: write files anywhere
  "--pre", "--pre-glob", "--hostname-bin", "--compress-program",   # rg/sort: run a program
]
# Matching (commands.py): `--opt` also as `--opt=value`; single-letter `-X` also inside clusters
# and glued values (`-rf`, `-f/etc/passwd`); longer `-opt` as prefix. pytest/tail extras live there.

[tools]
deny = ["WebFetch", "WebSearch"]   # no data egress from the agent

[mcp]                              # mcp__<server>__<tool> patterns (also enforced by mcp_proxy)
allow = ["mcp__serena__find_*", "mcp__serena__get_*", "mcp__serena__list_*", "mcp__serena__read_*"]

# ---------------------------------------------------------------- identities / roles
# Identity = Claude Code's agent_type (subagents) or GUARD_AGENT set by the launcher.
# The model cannot choose it. An identity not listed here is denied everything.
[agents.default]

[agents.reviewer]                  # read-only role
commands = ["ls", "cat", "grep", "rg", "git diff", "git log", "git show", "git status"]
ask = []
tools_deny = ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

[agents.Explore]                   # Claude Code's built-in read-only subagent
commands = ["ls", "cat", "grep", "rg", "find", "git log", "git show", "git diff"]
ask = []
tools_deny = ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]
